# Example presets for the zea app (`zea app`), listed in its preset dropdown.
#
# How presets reach users:
#   1. Edit this file in a pull request to tue-bmd/zea.
#   2. On merge to main, the `sync-hf.yaml` workflow uploads it to
#      hf://zeahub/app/presets.yaml (branch `main`).
#   3. Every installed zea version downloads that file when the app starts, so the
#      change is live without a zea release. Offline, the app falls back to the copy
#      of this file shipped with the installed zea package.
# Each release also snapshots this file to a `vX.Y.Z` branch on zeahub/app, which you can
# load with `zea app --presets-revision vX.Y.Z`.
#
# Preset fields:
#   name             Label in the dropdown (required, unique).
#   dataset          Dataset path: hf://owner/repo[/subfolder] (required).
#   config           Config path (optional; else the app looks for one next to the data).
#   key              Data key to process (default: data/raw_data).
#   file             File to pre-select; must lie inside `dataset`.
#   n_frames         Number of frames to load for `file` (default: 1).
#   revision         Branch, tag or PR ref (e.g. refs/pr/66) of the dataset and config.
#   min_zea_version  Hide the preset in older zea versions, e.g. for a preset that needs
#                    a feature added in that version.
#
# Bump `schema_version` only for changes older zea versions cannot read (e.g. renaming
# a field); they then ignore the downloaded file and use their bundled copy instead.
schema_version: 1

presets:
- name: PICMUS › Contrast speckle (RF)
  dataset: hf://zeahub/picmus/database/experiments/contrast_speckle/contrast_speckle_expe_dataset_rf
  config: hf://zeahub/picmus/config_rf.yaml
  key: data/raw_data
- name: PICMUS › Resolution distortion (IQ)
  dataset: hf://zeahub/picmus/database/experiments/resolution_distorsion/resolution_distorsion_expe_dataset_iq
  config: hf://zeahub/picmus/config_iq.yaml
  key: data/raw_data
- name: zea › Cardiac 2026
  dataset: hf://zeahub/zea-cardiac-2026
  config: hf://zeahub/zea-cardiac-2026/config.yaml
  key: data/raw_data
- name: zea › Carotid 2023
  dataset: hf://zeahub/zea-carotid-2023
  config: hf://zeahub/zea-carotid-2023/config.yaml
  key: data/raw_data
- name: CAMUS › Cardiac echo
  dataset: hf://zeahub/camus
  config: hf://zeahub/configs/config_camus.yaml
  key: data/image/values

