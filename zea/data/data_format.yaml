data:
  raw_data:
    description: The raw channel data of shape {shape}.
    type: float32
    required: true  # for zea this is not required.
    shape: [n_frames, n_tx, n_el, n_ax, n_ch]
    unit: "-"
  image:
    description: Reconstructed (log-compressed) image data and spatial extent metadata.
    pixels:
      description: The image pixels of shape {shape}.
      type: uint8
      shape: [n_frames, h, w, d]
    extent:
      description: The image extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]
  segmentation:
    description: Segmentation data and spatial extent metadata.
    pixels:
      description: The segmentation pixels of shape {shape}.
      type: uint8
      shape: [n_frames, h, w, d]
    extent:
      description: The segmentation extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]
    labels:
      description: The labels corresponding to the segmentation pixels, where each unique value in the pixels corresponds to a label in this list of shape {shape}.
      type: string
      shape: [n_labels]
  sos_map:
    description: Speed-of-sound map data and spatial extent metadata.
    pixels:
      description: The speed-of-sound map pixels in {unit} of shape {shape}.
      type: float32
      unit: m/s
      shape: [n_frames, h, w, d]
    extent:
      description: The speed-of-sound map extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]
  strain:
    description: Strain map data and spatial extent metadata.
    pixels:
      description: The strain pixels in {unit} of shape {shape}.
      type: float32
      unit: "%"
      shape: [n_frames, h, w, d]
    extent:
      description: The strain extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]
  swe:
    description: Shear-wave elastography data and spatial extent metadata.
    pixels:
      description: The shear-wave elastography pixels in {unit} of shape {shape}.
      type: float32
      unit: m/s
      shape: [n_frames, h, w, d]
    extent:
      description: The shear-wave elastography extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]
  tissue_doppler:
    description: Tissue Doppler data and spatial extent metadata.
    pixels:
      description: The tissue Doppler pixels in {unit} of shape {shape}.
      type: float32
      unit: m/s
      shape: [n_frames, h, w, d]
    extent:
      description: The tissue Doppler extent in {unit} of shape {shape} ordered as (xmin, xmax, ymin, ymax, zmax, zmin).
      type: float32
      unit: m
      shape: [n_frames, 6]

scan:
  us_machine:
    description: The ultrasound machine used to acquire the data.
    type: string
  probe_name:
    description: The name of the probe used to acquire the data.
    type: string
  n_ax:
    description: The number of axial samples.
    type: int
    unit: "#"
    required: true
  n_el:
    description: The number of elements in the probe.
    type: int
    unit: "#"
    required: true
  n_tx:
    description: The number of transmits per frame.
    type: int
    unit: "#"
    required: true
  n_ch:
    description: The number of channels (real/complex). For RF data this is 1. For IQ data this is 2.
    type: int
    required: true
  n_frames:
    description: The number of frames.
    type: int
    unit: "#"
    required: true
  sound_speed:
    description: The speed of sound in {unit}
    type: float
    unit: m/s
  probe_geometry:
    description: The probe geometry in {unit} of shape {shape}, represented as (x, y, z) coordinates.
    type: float32
    unit: m
    required: true
    shape: [n_el, 3]
  sampling_frequency:
    description: The sampling frequency in {unit}
    type: float32
    unit: Hz
    required: true
  center_frequency:
    description: The center frequency in {unit} of the transmit pulse. Single scalar if all transmits share the same center frequency; otherwise an array of shape {shape} with one frequency per transmit.
    type: float32
    unit: Hz
    required: true
    shape: [n_tx]
  demodulation_frequency:
    description: The frequency in {unit} at which the data should be demodulated. Usually the same as center_frequency, but different when doing harmonic imaging. Single scalar if all transmits share the same center frequency; otherwise an array of shape {shape} with one frequency per transmit.
    type: float32
    unit: Hz
    required: true
    shape: [n_tx]
  initial_times:
    description: The times in {unit} when the A/D converter starts sampling of shape {shape}. This is the time between the first element firing and the first recorded sample.
    type: float32
    unit: s
    required: true
    shape: [n_tx]
  t0_delays:
    description: The transmit delays in {unit} for each element of shape {shape}. This is the time at which each element fires, shifted such that the first element fires at t=0.
    type: float32
    unit: s
    required: true
    shape: [n_tx, n_el]
  tx_apodizations:
    description: The apodization values that were applied to each element during transmit of shape {shape}. This is a value between -1 and 1 that indicates how much each element contributed to the transmit beam, with 0 meaning no contribution and 1 meaning full contribution. Negative values indicate that the element was fired with opposite polarity.
    type: float32
    unit: "-"
    required: true
    shape: [n_tx, n_el]
  focus_distances:
    description: The transmit focus distances in {unit} of shape {shape}. This is the distance from the origin point on the transducer to where the beam comes to focus. For planewaves this is set to infinity or zero.
    type: float32
    unit: m
    required: true
    shape: [n_tx]
  transmit_origins:
    description: The transmit origins of the transmit beams in {unit} of shape {shape}. This is the (x, y, z) position from which the beam is transmitted.
    type: float32
    unit: m
    required: true
    shape: [n_tx, 3]
  polar_angles:
    description: The polar angles in {unit} of the transmit beams of shape {shape}.
    type: float32
    unit: rad
    required: true
    shape: [n_tx]
  azimuth_angles:
    description: The azimuthal angles in {unit} of the transmit beams of shape {shape}.
    type: float32
    unit: rad
    required: true
    shape: [n_tx]
  time_to_next_transmit:
    description: The time in {unit} between subsequent transmit events of shape {shape}.
    type: float32
    unit: s
    required: true
    shape: [n_frames, n_tx]
  tgc_gain_curve:
    description: The time-gain-compensation that was applied to every sample in the raw_data of shape {shape}. Divide by this curve to undo the TGC.
    type: float32
    unit: "-"
    shape: [n_ax]
  element_width:
    description: The width of the elements in the probe in {unit}.
    type: float32
    unit: m
  waveforms_one_way:
    description: One-way waveforms of shape {shape} as simulated by the Verasonics system. This is the waveform after being filtered by the transducer bandwidth once.
    type: float32
    shape: [n_tx, 500]
  waveforms_two_way:
    description: Two-way waveforms of shape {shape} as simulated by the Verasonics system. This is the waveform after being filtered by the transducer bandwidth twice.
    type: float32
    shape: [n_tx, 500]

metadata:
  subject:
    description: Subject metadata associated with the study.
    type:
      desciription: Subject type, e.g. human, phantom, animal.
      type: string
    age:
      description: Subject age in years.
      type: uint8
    sex:
      description: Subject sex.
      type: string
    fat:
      description: Subject fat percentage.
      type: float32
      unit: "%"
  credit:
    description: Lab or submitter credit for this dataset or recording.
    type: string
  probe_orientation:
    description: Probe pose and timing metadata.
    pose:
      description: Probe pose in {unit} of shape {shape}, ordered as (x, y, z, az, el, roll).
      type: float32
      unit: m
      shape: [T, 6]
    offset:
      description: Time offset in {unit} relative to frame timing.
      type: float32
      unit: s
    sampling_frequency:
      description: Sampling frequency in {unit} for probe orientation samples.
      type: float32
      unit: Hz
  voice_narration:
    description: Voice narration signal and timing metadata.
    samples:
      description: Voice narration samples of shape {shape}.
      type: uint8
      unit: "-"
      shape: [T, 1]
    offset:
      description: Time offset in {unit} relative to frame timing.
      type: float32
      unit: s
    sampling_frequency:
      description: Sampling frequency in {unit} for voice narration samples.
      type: float32
      unit: Hz
  ecg:
    description: ECG signal and timing metadata.
    samples:
      description: ECG samples of shape {shape}.
      type: uint8
      unit: "-"
      shape: [T, 1]
    offset:
      description: Time offset in {unit} relative to frame timing.
      type: float32
      unit: s
    sampling_frequency:
      description: Sampling frequency in {unit} for ECG samples.
      type: float32
      unit: Hz
  text_report:
    description: Free-text clinical or acquisition report.
    type: string
  annotations:
    description: Frame-level annotations, either per frame or broadcast over all frames.
    anatomy:
      description: Anatomy label.
      type: string
    view:
      description: View label of shape {shape}.
      type: string
      shape: [n_frames]
    label:
      description: Pathology or classification label of shape {shape}.
      type: string
      shape: [n_frames]
    image_quality:
      description: Image quality label with allowed values {low, mid, high}.
      type: string


metrics:
  common_midpoint_phase_error:
    description: The common midpoint phase error in {unit} of shape {shape}.
    type: float32
    unit: rad
    shape: [n_frames]
  coherence_factor:
    description: The coherence factor of shape {shape}.
    type: float32
    unit: "-"
    shape: [n_frames]