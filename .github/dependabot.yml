## Dependabot configuration file
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-packages:
        patterns:
          - "*"
    assignees:
       - "tristan-deep"
    labels:
       - "dev"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "protobuf"
        versions:
          - ">6.0.0"
        # see https://github.com/tue-bmd/zea/issues/329
      # The ML backends are pinned by uv.lock (the jax-*/torch-*/tf-* dependency-groups in
      # pyproject.toml). They have to move together -- one shared CUDA runtime, matched to
      # the PyTorch index -- so they are bumped by hand with
      # ./scripts/resolve_backend_versions.sh + `uv lock --upgrade-package ...`, not per package.
      - dependency-name: "jax"
      - dependency-name: "jaxlib"
      - dependency-name: "tensorflow"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
       - "tristan-deep"
    labels:
       - "dev"
    open-pull-requests-limit: 3
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"
    assignees:
       - "tristan-deep"
    labels:
       - "dev"
    open-pull-requests-limit: 3
