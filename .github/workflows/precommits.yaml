name: Precommithooks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependabot-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --staged --quiet || git commit -m "chore: regenerate uv.lock after Dependabot update" && git push

  precommithooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel
          pip install ruff pre-commit

      - name: Run pre-commit hooks
        id: precommithooks
        run: |
          pre-commit run check-yaml --all-files
          pre-commit run check-merge-conflict --all-files
          pre-commit run detect-private-key --all-files
          pre-commit run uv-lock --all-files
          pre-commit run notebook-clean-and-check --all-files
        continue-on-error: true

      - name: Check pre-commit result
        if: ${{ steps.precommithooks.outcome == 'failure' }}
        run: |
          echo "pre-commit hooks failed; did you forget to set up the pre-commit hooks?"
          echo "see the contributing page for more info: https://zea.readthedocs.io/en/latest/contributing.html"
          exit 1
