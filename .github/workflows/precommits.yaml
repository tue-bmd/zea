name: Precommithooks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  precommithooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run pre-commit hooks
        id: precommithooks
        run: |
          uvx pre-commit run check-yaml --all-files
          uvx pre-commit run check-merge-conflict --all-files
          uvx pre-commit run detect-private-key --all-files
          uvx pre-commit run uv-lock --all-files
          uvx pre-commit run notebook-clean-and-check --all-files
        continue-on-error: true

      - name: Check pre-commit result
        if: ${{ steps.precommithooks.outcome == 'failure' }}
        run: |
          echo "pre-commit hooks failed; did you forget to set up the pre-commit hooks?"
          echo "see the contributing page for more info: https://zea.readthedocs.io/en/latest/contributing.html"
          exit 1
