name: Docker Images

on:
  push:
    branches:
      - 'docker/**'
    tags:
      - '*'

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: zeahub

jobs:
  tag:
    uses: ./.github/workflows/set-tag.yaml

  build-production-images:
    needs: [tag]
    runs-on: self-hosted-build
    timeout-minutes: 200
    strategy:
      max-parallel: 1
      matrix:
        backend: [all, jax, torch, tensorflow, numpy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print runner IP report (non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set +o pipefail

          echo "Attempting to detect IP information from runner container context..."

          echo "Hostname:"
          hostname 2>/dev/null || echo "unavailable"

          echo "Primary container IP (hostname -I):"
          hostname -I 2>/dev/null | awk '{print $1}' || echo "unavailable"

          echo "All container IPv4 addresses:"
          if command -v ip >/dev/null 2>&1; then
            ip -4 -o addr show scope global 2>/dev/null | awk '{print $2 ": " $4}' || echo "unavailable"
          else
            echo "ip command unavailable"
          fi

          echo "Host IP candidate via host.docker.internal:"
          if command -v getent >/dev/null 2>&1; then
            getent hosts host.docker.internal 2>/dev/null | awk '{print $1}' | head -n1 || echo "unavailable"
          else
            echo "getent unavailable"
          fi

          echo "Host IP candidate via default gateway:"
          if command -v ip >/dev/null 2>&1; then
            ip route 2>/dev/null | awk '/default/ {print $3; exit}' || echo "unavailable"
          else
            echo "ip command unavailable"
          fi

          echo "Public egress IPv4:"
          if command -v curl >/dev/null 2>&1; then
            curl -4 -s --max-time 5 https://api.ipify.org || echo "unavailable"
            echo
          else
            echo "curl unavailable"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.backend }}-cpu:${{ needs.tag.outputs.docker_tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/{2}-cpu:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.backend) || '' }}
          build-args: |
            INSTALL_JAX=${{ contains('all,jax', matrix.backend) && 'cpu' || 'false' }}
            INSTALL_TORCH=${{ contains('all,torch', matrix.backend) && 'cpu' || 'false' }}
            INSTALL_TF=${{ contains('all,tensorflow', matrix.backend) && 'cpu' || 'false' }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache,mode=max

      - name: Build and push GPU Docker image
        if: ${{ matrix.backend != 'numpy' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.backend }}:${{ needs.tag.outputs.docker_tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.backend) || '' }}
          build-args: |
            INSTALL_JAX=${{ (matrix.backend == 'all' || matrix.backend == 'jax') && 'gpu' || 'false' }}
            INSTALL_TORCH=${{ (matrix.backend == 'all' || matrix.backend == 'torch') && 'gpu' || 'false' }}
            INSTALL_TF=${{ (matrix.backend == 'all' || matrix.backend == 'tensorflow') && 'gpu' || 'false' }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache,mode=max
