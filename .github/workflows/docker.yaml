name: Docker Images

on:
  push:
    branches:
      - 'docker/**'
    tags:
      - '*'

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: zeahub

jobs:
  tag:
    uses: ./.github/workflows/set-tag.yaml

  build-production-images:
    needs: [tag]
    runs-on: self-hosted-build
    timeout-minutes: 200
    strategy:
      max-parallel: 1
      matrix:
        backend: [all, jax, torch, tensorflow, numpy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print runner IP address (non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          echo "Attempting to detect host IP from runner container context..."

          # Container IP (for context only).
          CONTAINER_IP=""
          if command -v hostname >/dev/null 2>&1; then
            CONTAINER_IP="$(hostname -I 2>/dev/null | awk '{print $1}' || true)"
          fi
          if [ -z "$CONTAINER_IP" ] && command -v ip >/dev/null 2>&1; then
            CONTAINER_IP="$(ip -4 -o addr show scope global 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -n1 || true)"
          fi

          # Host IP candidates from inside container.
          HOST_IP=""

          # Common Docker hostname (works in many environments, including Docker Desktop).
          if [ -z "$HOST_IP" ] && command -v getent >/dev/null 2>&1; then
            HOST_IP="$(getent hosts host.docker.internal 2>/dev/null | awk '{print $1; exit}' || true)"
          fi

          # Default gateway is often the host-side bridge address in Linux containerized runners.
          if [ -z "$HOST_IP" ] && command -v ip >/dev/null 2>&1; then
            HOST_IP="$(ip route 2>/dev/null | awk '/default/ {print $3; exit}' || true)"
          fi

          if [ -n "$CONTAINER_IP" ]; then
            echo "Runner container IP: $CONTAINER_IP"
          else
            echo "Runner container IP: unavailable"
          fi

          if [ -n "$HOST_IP" ]; then
            echo "Host IP candidate: $HOST_IP"
          else
            echo "Host IP candidate: unavailable (non-fatal)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.backend }}-cpu:${{ needs.tag.outputs.docker_tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/{2}-cpu:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.backend) || '' }}
          build-args: |
            INSTALL_JAX=${{ contains('all,jax', matrix.backend) && 'cpu' || 'false' }}
            INSTALL_TORCH=${{ contains('all,torch', matrix.backend) && 'cpu' || 'false' }}
            INSTALL_TF=${{ contains('all,tensorflow', matrix.backend) && 'cpu' || 'false' }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache,mode=max

      - name: Build and push GPU Docker image
        if: ${{ matrix.backend != 'numpy' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.backend }}:${{ needs.tag.outputs.docker_tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/{2}:latest', env.REGISTRY, env.IMAGE_PREFIX, matrix.backend) || '' }}
          build-args: |
            INSTALL_JAX=${{ (matrix.backend == 'all' || matrix.backend == 'jax') && 'gpu' || 'false' }}
            INSTALL_TORCH=${{ (matrix.backend == 'all' || matrix.backend == 'torch') && 'gpu' || 'false' }}
            INSTALL_TF=${{ (matrix.backend == 'all' || matrix.backend == 'tensorflow') && 'gpu' || 'false' }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache,mode=max
