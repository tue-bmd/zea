# The main PR gate: unit tests with coverage, a minimum-dependency-floor check,
# heavy and notebook tests on self-hosted runners, the docs build, and a
# Dockerfile build + smoke test.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  MAIN_REPO: tue-bmd/zea

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Git
        run: git config --global safe.directory $GITHUB_WORKSPACE

      - uses: ./.github/actions/setup-zea

      - name: Run Pytest
        run: |
          pytest --cov --cov-branch --cov-report=xml --junitxml=junit.xml \
            -o junit_family=legacy -p no:cacheprovider \
            -m 'not heavy and not notebook' ./tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ env.MAIN_REPO }}
          flags: unit
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ env.MAIN_REPO }}
          flags: unit
          report_type: test_results
          files: ./junit.xml
          verbose: true

  # Guard against zea accidentally using functionality newer than the dependency
  # floors declared in pyproject.toml. Installs the *lowest* allowed versions of
  # zea's declared deps and runs the import tests against them.
  # `.[app]` is named explicitly so lowest-direct pins gradio to its declared
  # floor: reached only via the `tests` group's `zea[app]` self-reference it
  # would count as transitive and resolve to the newest release instead.
  minimum-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Lowest Python we support (see requires-python in pyproject.toml).
          python-version: "3.11"

      - name: Install zea at lowest declared dependency versions
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv venv
          uv pip install --resolution lowest-direct --group tests -e ".[app]" \
            "tensorflow-cpu>=2.16.1" "jax[cpu]>=0.4.35" "torch>=2.2"
          echo "::group::Resolved dependency versions"
          uv pip freeze
          echo "::endgroup::"

      - name: Run import tests against minimum dependencies
        # --no-sync: run in the floor-pinned venv as-is; never re-resolve to the
        # default (highest) versions, which would defeat the guard.
        # Only the import tests run here: this job exists to catch usage of APIs
        # newer than the declared dependency floors, which surfaces at import time.
        run: uv run --no-sync pytest -p no:cacheprovider ./tests/test_imports.py

  heavy-tests:
    runs-on: self-hosted
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: heavy-tests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      # The runners are ephemeral ARC pods -- one job per pod -- so nothing survives in
      # the container filesystem. Only these two PersistentVolumes do, which is why the
      # uv cache lives *inside* the zea one rather than at a path of its own: an
      # unmounted /cache/uv would be discarded with the pod, and the runner user cannot
      # create it anyway (/cache itself is root-owned inside the pod).
      # HF_HOME and ZEA_CACHE_DIR are also set on the RunnerDeployment; repeated here so
      # the job is readable on its own.
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface
      ZEA_CACHE_DIR: /cache/zea
      UV_CACHE_DIR: /cache/zea/uv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zea
        with:
          # UV_CACHE_DIR above is on a PersistentVolume, so it already survives
          # between runs -- no need to ship the cache to the Actions cache service.
          enable-cache: "false"

      - name: Run heavy tests
        run: |
          pytest --cov --cov-branch --cov-report=xml --junitxml=junit.xml \
            -o junit_family=legacy -p no:cacheprovider -m 'heavy' ./tests

      - name: Upload heavy coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ env.MAIN_REPO }}
          flags: heavy
          verbose: true

      - name: Upload heavy test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ env.MAIN_REPO }}
          flags: heavy
          report_type: test_results
          files: ./junit.xml
          verbose: true

  notebook-tests:
    name: notebook-tests (${{ matrix.label }})
    runs-on: self-hosted
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            dirs: agent
            label: agent
          - name: models
            dirs: models
            label: models
          - name: pipeline
            dirs: pipeline
            label: pipeline
          - name: data-metrics
            dirs: "data metrics"
            label: data+metrics
    concurrency:
      group: notebook-tests-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      # See heavy-tests for why these are the only paths that persist, and why the uv
      # cache sits inside the zea one.
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface
      ZEA_CACHE_DIR: /cache/zea
      UV_CACHE_DIR: /cache/zea/uv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zea
        with:
          enable-cache: "false"

      - name: Run ${{ matrix.name }} notebook tests
        run: |
          DIRS_ARGS=$(echo "${{ matrix.dirs }}" | tr ' ' '\n' | sed 's/^/--notebook-dir /' | tr '\n' ' ')
          pytest -p no:cacheprovider -s -m 'notebook' $DIRS_ARGS

  test-docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Git
        run: git config --global safe.directory $GITHUB_WORKSPACE

      - uses: ./.github/actions/setup-zea

      # nbsphinx shells out to pandoc to render the example notebooks. It ships with
      # the GitHub runner images; the guard keeps this working if that ever changes.
      - name: Ensure pandoc is available
        run: |
          command -v pandoc || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pandoc
          }

      - name: Build documentation with Sphinx (fails on warnings, linkcheck warns only)
        working-directory: docs
        env:
          ZEA_LOG_LEVEL: ERROR
        run: |
          make docs-clean
          make docs-build SPHINXOPTS='-W --keep-going'
          make docs-test
          make docs-linkcheck SPHINXOPTS='--keep-going' || \
            echo '::warning title=Docs linkcheck failed::Sphinx linkcheck reported unreachable links. This can be a false positive (rate limiting, transient network issues, bot protection). See the step log for the offending URLs.'

  # The jobs above run against a plain `uv sync`, not the published image, so this job
  # is what keeps the Dockerfile from silently rotting. It only runs when a file that
  # can actually break the image changes.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether to build
        id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Push build — always building"
            exit 0
          fi
          # Unauthenticated fetch (persist-credentials: false); fine on a public repo.
          git fetch origin "$BASE_REF"
          # Compare against the just-fetched tip (FETCH_HEAD). On the shallow
          # checkout used here the remote-tracking ref origin/$BASE_REF is not
          # updated by `git fetch origin "$BASE_REF"` and may be stale or absent.
          if git diff --quiet FETCH_HEAD -- Dockerfile .dockerignore pyproject.toml uv.lock README.md scripts/motd.sh; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "No image-relevant files changed — skipping"
          else
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Image-relevant files changed — building"
          fi

      - name: Free up disk space
        if: steps.check.outputs.build == 'true'
        run: |
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      # Only needed to *write* the build cache, which fork PRs cannot do anyway.
      # Reading it needs no credentials: the cache ref is public.
      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.build == 'true' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the CPU image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            INSTALL_JAX=cpu
            INSTALL_TORCH=cpu
            INSTALL_TF=cpu
            DEV=true
          push: false
          load: true
          tags: zea:ci
          cache-from: type=registry,ref=ghcr.io/tue-bmd/zea/build-cache:all-cpu
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/tue-bmd/zea/build-cache:all-cpu,mode=max' || '' }}

      # No bind mount: the point is to exercise the image's own copy of zea.
      - name: Smoke-test the image
        if: steps.check.outputs.build == 'true'
        run: |
          docker run --rm zea:ci python -c "import zea; print(zea.__version__)"
          docker run --rm zea:ci pytest -p no:cacheprovider ./tests/test_imports.py
          # The motd reads the installed version out of the environment; a blank one
          # means the image lost the tooling it needs to introspect itself.
          docker run --rm zea:ci bash /etc/motd.sh | grep -qE 'v[0-9]+\.'
