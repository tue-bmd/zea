# Manually triggered release preparation: bumps the version in `pyproject.toml`,
# refreshes `uv.lock`, and opens a "Release vX.Y.Z" PR holding a single
# "bump version to vX.Y.Z" commit.
#
# Merging that PR does not release anything by itself -- publishing a GitHub
# release tagged vX.Y.Z is still a manual step, and that is what triggers
# `publish.yaml` (PyPI), `docker.yaml` (images) and `release-tags.yaml`
# (moves `latest` / `openh-rf-latest` and rebuilds the docs).
#
# Requires a `RELEASE_PAT` secret -- see the comment on the checkout step.
name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version to release, overriding `bump` (e.g. 0.2.0, 0.2.0rc1)"
        required: false
        type: string

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # RELEASE_PAT is required, not optional. Pushes made with GITHUB_TOKEN do
          # not trigger other workflows, so a PR opened with it gets none of the
          # status checks `main`'s ruleset requires and can never be merged. The
          # fallback only exists so a missing secret still produces a visible PR.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: false

      - name: Determine next version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, tomllib

          current = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          explicit = os.environ["INPUT_VERSION"].strip().lstrip("v")

          if explicit:
              new = explicit
          else:
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)", current)
              if not match:
                  raise SystemExit(f"cannot bump {current!r} automatically; pass an explicit `version`")
              major, minor, patch = (int(part) for part in match.groups())
              bump = os.environ["INPUT_BUMP"]
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              new = f"{major}.{minor}.{patch}"

          # Keep releases to the shapes this project has actually used, so a typo
          # in the manual `version` input cannot mint a nonsense tag.
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", new):
              raise SystemExit(f"refusing to release invalid version {new!r}")
          if new == current:
              raise SystemExit(f"version {new!r} is already the current version")

          print(f"current={current}")
          print(f"new={new}")
          print(f"tag=v{new}")
          print(f"branch=release/v{new}")
          PY

      - name: Bump version and relock
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          current, new = os.environ["CURRENT"], os.environ["NEW"]
          path = pathlib.Path("pyproject.toml")
          text, count = re.subn(
              rf'(?m)^version = "{re.escape(current)}"$', f'version = "{new}"', path.read_text(), count=1
          )
          if count != 1:
              raise SystemExit(f'could not find `version = "{current}"` in pyproject.toml')
          path.write_text(text)
          PY
          uv lock
          git diff --stat

      - name: Commit and push release branch
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add pyproject.toml uv.lock
          git commit -m "bump version to ${TAG}"
          # Force so a re-run after a failed attempt replaces the stale branch
          # rather than erroring out.
          git push --force origin "${BRANCH}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          CURRENT: ${{ steps.version.outputs.current }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url // ""')
          if [ -n "${existing}" ]; then
            echo "Reusing existing pull request: ${existing}"
            echo "[Release ${TAG}](${existing}) (updated)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body=$(cat <<EOF
          Prepared by the [Release PR](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release-pr.yaml) workflow: \`${CURRENT}\` → \`${NEW}\`.

          - \`pyproject.toml\`: \`version = "${NEW}"\`
          - \`uv.lock\`: refreshed with \`uv lock\`

          After merging, publish a GitHub release tagged \`${TAG}\` off \`main\`. That is what actually ships: it triggers \`publish.yaml\` (PyPI), \`docker.yaml\` (images) and \`release-tags.yaml\` (moves \`latest\` and \`openh-rf-latest\`, then rebuilds the docs).
          EOF
          )

          url=$(gh pr create --base main --head "${BRANCH}" --title "Release ${TAG}" --body "${body}")
          echo "Opened ${url}"
          echo "[Release ${TAG}](${url})" >> "$GITHUB_STEP_SUMMARY"
