# Keeps the Read the Docs versions that track our moving tags (`latest` and
# `openh-rf-latest`) pointing at the commit the tag was just moved to.
#
# Read the Docs' own webhook races the force-push: it starts a build while its
# cached git ref still resolves to the previous release, so the build succeeds
# while publishing the *old* docs -- nothing shows up as failed, the docs are
# just silently stale. We therefore make Read the Docs re-read the refs first,
# wait until the version resolves to the pushed commit, and only then build.
name: Rebuild Docs

on:
  push:
    tags:
      - latest
      - openh-rf-latest
  workflow_call:
    inputs:
      version:
        description: "Read the Docs version slug to rebuild"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Read the Docs version slug to rebuild"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - openh-rf-latest

jobs:
  rebuild:
    name: Rebuild ${{ inputs.version || github.ref_name }} on Read the Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync Read the Docs versions and rebuild
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
          RTD_PROJECT: zea
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          API="https://app.readthedocs.org/api/v3/projects/${RTD_PROJECT}"
          AUTH="Authorization: Token ${RTD_TOKEN}"

          # Resolve the tag ourselves rather than trusting github.sha, so that a
          # manual workflow_dispatch re-run targets the tag and not the branch head.
          EXPECTED=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}" | cut -f1)
          if [ -z "${EXPECTED}" ]; then
            echo "::error::tag ${VERSION} does not exist on origin"
            exit 1
          fi
          echo "Tag ${VERSION} points at ${EXPECTED}"

          # 1. Force Read the Docs to re-read the git refs. Without this its
          #    cached ref for a force-moved tag still points at the old release.
          curl -sS -X POST -H "${AUTH}" -H "Content-Length: 0" -o /dev/null -w 'sync-versions: HTTP %{http_code}\n' "${API}/sync-versions/"

          # 2. Wait for the sync to land before asking for a build, otherwise we
          #    just reproduce the race we are trying to avoid.
          ident=""
          for attempt in $(seq 1 40); do
            ident=$(curl -sS -H "${AUTH}" "${API}/versions/${VERSION}/" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("identifier") or "")')
            echo "  sync attempt ${attempt}: identifier=${ident:-<none>}"
            [ "${ident}" = "${EXPECTED}" ] && break
            sleep 15
          done
          if [ "${ident}" != "${EXPECTED}" ]; then
            echo "::error::Read the Docs still resolves ${VERSION} to ${ident:-<none>}, expected ${EXPECTED}"
            exit 1
          fi

          # 3. Build, then confirm the build really used the commit we expect --
          #    a green build on the wrong commit is exactly the failure mode here.
          build_id=$(curl -sS -X POST -H "${AUTH}" -H "Content-Length: 0" "${API}/versions/${VERSION}/builds/" | python3 -c 'import sys,json;print((json.load(sys.stdin).get("build") or {}).get("id") or "")')
          if [ -z "${build_id}" ]; then
            echo "::error::Read the Docs did not accept the build request"
            exit 1
          fi
          echo "Triggered build: https://app.readthedocs.org/projects/${RTD_PROJECT}/builds/${build_id}/"

          state=""
          success=""
          commit=""
          for attempt in $(seq 1 80); do
            read -r state success commit <<<"$(curl -sS -H "${AUTH}" "${API}/builds/${build_id}/" | python3 -c 'import sys,json;b=json.load(sys.stdin);print((b.get("state") or {}).get("code"), b.get("success"), b.get("commit"))')"
            echo "  build ${build_id}: state=${state} success=${success} commit=${commit}"
            [ "${state}" = "finished" ] && break
            sleep 15
          done

          if [ "${state}" != "finished" ]; then
            echo "::error::build ${build_id} did not finish within the timeout"
            exit 1
          fi
          if [ "${success}" != "True" ]; then
            echo "::error::build ${build_id} failed"
            exit 1
          fi
          if [ "${commit}" != "${EXPECTED}" ]; then
            echo "::error::build ${build_id} published ${commit}, expected ${EXPECTED}"
            exit 1
          fi
          echo "${VERSION} rebuilt from ${EXPECTED}"
