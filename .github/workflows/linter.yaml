name: Linter

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Ruff version comes from the `lint` dependency-group in pyproject.toml
      # (pinned via uv.lock, updated by Dependabot). No version is pinned here.
      - name: Run Linter
        run: uv run --only-group lint ruff check --config pyproject.toml --verbose

      - name: Run Formatter
        run: uv run --only-group lint ruff format --config pyproject.toml --check --verbose

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # ty needs zea's dependencies importable to resolve types (no false
      # positives from unresolved imports). `uv run` installs the package
      # itself; the heavy ML backends (jax/torch/tensorflow) are extras and are
      # intentionally left out, so their conditional imports are downgraded to
      # warnings in [tool.ty]. ty's version comes from the `lint` group.
      - name: Run Type Checker
        run: uv run --python 3.10 --group lint ty check --exit-zero-on-warning
