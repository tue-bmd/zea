# On a published GitHub release: builds and checks the wheel and sdist
# (`package.yaml`), then uploads them to PyPI via trusted publishing (no API
# token needed). Nothing is uploaded when the check fails.
name: Build and Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and check distribution 📦
    uses: ./.github/workflows/package.yaml

  publish-to-pypi:
    name: >-
      Publish to PyPI 🐍
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zea
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
