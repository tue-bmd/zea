[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"

[project]
name = "zea"
version = "0.1.4"
description = "A Toolbox for Cognitive Ultrasound Imaging. Provides a set of tools for processing of ultrasound data, all built in your favorite machine learning framework."
authors = [
    { name = "Tristan Stevens", email = "t.s.w.stevens@tue.nl" },
    { name = "Wessel van Nierop", email = "w.l.v.nierop@tue.nl" },
    { name = "Ben Luijten", email = "w.m.b.luijten@tue.nl" },
    { name = "Vincent van de Schaft", email = "v.v.d.schaft@tue.nl" },
    { name = "Oisín Nolan", email = "o.i.nolan@tue.nl" },
    { name = "Beatrice Federici", email = "b.federici@tue.nl" },
    { name = "Louis van Harten", email = "l.d.v.harten@tue.nl" },
    { name = "Simon Penninga", email = "s.w.penninga@tue.nl" },
    { name = "Noortje Schueler", email = "n.i.p.schueler@tue.nl" },
    { name = "Ruud van Sloun", email = "r.j.g.v.sloun@tue.nl" },
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["ultrasound", "machine learning", "beamforming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "keras >=3.15.0",
    "h5py >=3.11",
    "hdf5plugin >=4.4",
    "numcodecs >=0.13",
    "fsspec[http]",
    "numpy >= 1.24",
    "matplotlib >=3.10",
    "scipy >=1.13",
    "pillow >=12.2.0",
    "tqdm >=4",
    "pyyaml >=6",
    "decorator >=5",
    "huggingface_hub >=1.2",
    "tyro >=1.0",
    "wandb >=0.18",
    "wget >=3.2",
    "imageio[ffmpeg] >=2.0",
    "grain >= 0.2.8",
    # can we make these optional or remove?
    "scikit-image >=0.23",
    "scikit-learn >=1.4",
]
[project.optional-dependencies]
jax = ["jax[cuda12]>=0.4.35"]
display = ["opencv-python>=4"]
display-headless = ["opencv-python-headless>=4"]
# most models don't needs these optional dependencies
# but some do, so we list them here
models = ["onnxruntime>=1.15"]
app = ["gradio>=6.0"]
# Unpinned extras for `pip install zea[backends]`; development uses the pinned
# jax-*/torch-*/tf-* dependency-groups below instead.
# TensorFlow only ships Keras 3 from 2.16.1 onwards; older versions pin keras <3.
backends = ["jax>=0.4.35", "tensorflow>=2.16.1", "torch>=2.2"]

[project.urls]
Homepage = "https://github.com/tue-bmd/zea/"
Repository = "https://github.com/tue-bmd/zea/"
Documentation = "https://zea.readthedocs.io"
Issues = "https://github.com/tue-bmd/zea/issues"
Contributing = "https://zea.readthedocs.io/en/latest/contributing.html"

[project.scripts]
zea = "zea.__main__:main"

# Dev-only tooling: unlike extras, groups are never published. Needs pip >= 25.1 / uv.
# uv installs `dev` by default; lean envs opt out with --no-default-groups /
# --only-group (readthedocs: UV_NO_DEFAULT_GROUPS, set in its dashboard).
[dependency-groups]
lint = ["ruff==0.16.0", "ty==0.0.64"]
tests = [
    "pytest>=9.0.3",
    "papermill>=2.4",
    "ipykernel>=6.29.5",
    "cloudpickle>=3.1.1",
    "simpleitk>=2.2.1",
    "ipywidgets",
    "pre-commit",
    "pytest-cov",
    "zea[app]",
]
docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_design",
    "sphinx-reredirects",
    "sphinxcontrib-bibtex>=2.6.5",
    "pybtex>=0.26.1",
    "myst-parser",
    "nbsphinx",
    "furo",
    "PyStemmer",
    "IPython",
]
# The full dev environment: the tooling groups plus the runtime extras
dev = [
    { include-group = "tests" },
    { include-group = "docs" },
    { include-group = "lint" },
    "zea[display-headless]",
    "zea[models]",
    "pip", # uv does not seed pip into the venvs it creates
]

# ML backends, pinned by uv.lock rather than the Dockerfile, so that
# `uv sync --group jax-gpu ...` installs them in place -- no image rebuild. The bounds
# are floors; `uv lock --upgrade-package jax` (etc.) moves the locked versions.
jax-cpu = ["jax>=0.10.2"]
jax-gpu = ["jax[cuda12]>=0.10.2"]
torch-cpu = ["torch>=2.2", "torchvision", "torchaudio"]
torch-gpu = ["torch>=2.2", "torchvision", "torchaudio"]
tf-cpu = ["tensorflow>=2.21"]
tf-gpu = ["tensorflow[and-cuda]>=2.21"]

[tool.uv]
# torch-cpu and torch-gpu are the same package from different indexes, so uv has to fork.
conflicts = [[{ group = "torch-cpu" }, { group = "torch-gpu" }]]

# One index per compute backend; `explicit` keeps everything else on PyPI. To move to
# another CUDA generation, run ./scripts/resolve_backend_versions.sh.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# PyTorch ships no CUDA wheels for macOS, so torch-gpu falls back to PyPI there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "torch-cpu" },
    { index = "pytorch-cu129", group = "torch-gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "torch-cpu" },
    { index = "pytorch-cu129", group = "torch-gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", group = "torch-cpu" },
    { index = "pytorch-cu129", group = "torch-gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["zea"]

[tool.hatch.build.targets.sdist]
include = ["/zea", "/README.md", "/LICENSE", "/CITATION.cff"]

[tool.ruff]
# We use ruff to lint and auto-format code

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "keras_ops.py",
]

# more lenient line width than Black
line-length = 100
indent-width = 4

# minimum target python version
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
ignore = [
    "E731", # Ignore ambiguous variable name globally
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]

"__init__.py" = [
    "F401", # unused imports
    "E501", # line too long
    "E402", # module level import not at top of file
]

"tests/**/__init__.py" = [
    "F403", # * imports
]

"docs/source/parameters_doc.py" = [
    "E501", # line too long
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty]
# We use ty (https://github.com/astral-sh/ty) for static type checking.

[tool.ty.environment]
# Minimum supported Python version (see `requires-python`).
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.src]
include = ["zea"]
exclude = ["zea/ops/keras_ops.py"] # generated file (see _generate_keras_ops)

# Keras Layer subclasses deliberately override `call` with domain-specific
# signatures; Keras dispatches through __call__ and never calls .call()
# polymorphically, so this override pattern is intentional.
[[tool.ty.overrides]]
include = ["zea/ops/**/*.py", "zea/models/**/*.py", "zea/data/layers.py"]
[tool.ty.overrides.rules]
invalid-method-override = "ignore"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Dump stacks for any test still running after 5 minutes; nothing here is that slow.
faulthandler_timeout = 300
markers = [
    "performance: marks tests as performance (deselect with '-m \"not performance\"')",
    "heavy: marks tests as heavy (deselect with '-m \"not heavy\"')",
    "notebook: mark a test as a notebook test (deselect with '-m \"not notebook\"')",
    "gpu: marks tests that exercise real GPU hardware (most meaningful offline; in CI CUDA_VISIBLE_DEVICES=\"\" forces CPU)",
]
filterwarnings = [
    "ignore:.*SwigPyPacked.*:DeprecationWarning",
    "ignore:.*SwigPyObject.*:DeprecationWarning",
    "ignore:.*swigvarlink.*:DeprecationWarning",
    "ignore::DeprecationWarning:jupyter_client.*",
    "ignore::DeprecationWarning:papermill.*",
    "ignore:.*__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning",
    "ignore:.*os\\.fork\\(\\) was called.*:RuntimeWarning",
    "ignore:.*hf_xet.*:DeprecationWarning",
    "ignore:'(oneOf|parseString|resetCache|enablePackrat)' deprecated:DeprecationWarning",  # matplotlib -> old pyparsing API
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:.*sentry_sdk.Hub. is deprecated:DeprecationWarning",  # wandb -> deprecated sentry Hub API
]

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true
omit = [
    "/tmp/__autograph_generated_file*.py",
    # CI syncs the environment into the workspace, so it would otherwise be measured.
    "*/.venv/*",
    # Synthetic module compiled in-memory by tests/test_log.py; never on disk.
    "*/_fake_internal_module.py",
]

[tool.coverage.report]
omit = ["zea/ops/keras_ops.py", "zea/data/app.py"]
exclude_also = [
    # Module entry-point guards only run as `python -m ...`, not under pytest.
    'if __name__ == .__main__.:',
]
